name: deploy

# Staging and production deploys (S-002, ADR-0002).
# - staging: after the `ci` workflow passes on a push to `main`, at the commit CI tested.
# - production: when the `production` branch is fast-forwarded to a commit staging already
#   runs (the Owner's deliberate action), or by "Run workflow" on the `production` branch.
# Each deploy applies pending migrations first (expand/contract, backward-compatible), then
# runs the guarded deploy script (scripts/check-deploy.ts refuses a build for another env).
# Secrets are referenced by name only; docs/runbooks/deploy-keys.md says where each comes
# from. Until they exist, the preflight job prints a notice and the deploy job is skipped,
# so the workflow stays green.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      hyperdrive:
        description: Staging only. Tick to deploy with the Hyperdrive binding (off by default, ADR-0003 amendment; the Worker otherwise uses DATABASE_URL).
        type: boolean
        default: false

permissions:
  contents: read
  deployments: read
  actions: read

# One deploy per environment at a time, never cancelled half-way (a migration may be running).
concurrency:
  group: deploy-${{ github.ref == 'refs/heads/production' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  staging-preflight:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.keys.outputs.configured }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Require a green ci run for this commit (manual runs only)
        # The workflow_run path is already gated on a green ci; "Run workflow" is not.
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ok=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$SHA&status=success" --jq '.total_count')
          if [ "${ok:-0}" -lt 1 ]; then
            echo "::error::No successful ci run for $SHA. Wait for ci to pass on this commit (or fix it), then run the workflow again."
            exit 1
          fi
          echo "ci passed for $SHA"
      - name: Check deploy keys
        id: keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: src/scripts/check-keys.sh CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_DATABASE_URL

  staging:
    needs: staging-preflight
    if: needs.staging-preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Apply pending migrations (staging)
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run db:migrate
      - name: Seed the sample cake (staging only, idempotent)
        # S-011 sample product so the Owner can walk the skeleton on staging. Its photo is a
        # bundled SVG (app/db/sample-data.ts), so no Storage upload. Never in production: this
        # step exists only in the staging job and the script refuses APP_ENV=production.
        env:
          APP_ENV: staging
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: npm run seed:sample
      - name: Build, check and deploy (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Plain repository variable (not a secret). Used only by a manual run with `hyperdrive`
          # ticked: with the binding, parameterised queries timed out (ADR-0003 amendment).
          HYPERDRIVE_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.hyperdrive && vars.STAGING_HYPERDRIVE_ID || '' }}
        run: npm run deploy:staging
      - name: Launch readiness (staging, secret names only)
        # Lists which core secrets and optional integrations the Worker still lacks
        # (scripts/launch-readiness.ts). Warns in the run summary; never fails the deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run check:launch -- staging
      - name: Smoke check (staging is not indexed; a failed request is explained from wrangler tail)
        # The first requests after a deploy are the cold ones. wrangler tail captures them; a
        # failure prints the matching events' outcome, exceptions and error lines, redacted.
        # The raw capture holds URLs with tokens: it is never printed and is deleted.
        if: vars.STAGING_URL != ''
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_HIDE_BANNER: "true"
          WRANGLER_SEND_METRICS: "false"
        run: |
          SMOKE="$RUNNER_TEMP/smoke"
          mkdir -p "$SMOKE"
          trap 'rm -rf "$SMOKE"' EXIT
          npx wrangler tail auxpetitsbonheurs-staging --format json > "$SMOKE/tail.json" 2> "$SMOKE/tail.log" &
          tail_pid=$!
          sleep 12 # let the tail connect; no request before it, so the first one stays cold
          failed=0
          check() { # GET a path; record a non-2xx/3xx answer or a timeout for the diagnostics
            local started status
            started=$(date +%s%3N)
            status=$(curl -sS -o /dev/null -D "$SMOKE/headers" -w '%{http_code}' --max-time 20 "$STAGING_URL$1") || status=000
            echo "GET $1 -> $status"
            if [ "$status" = 000 ]; then
              failed=1; printf '{"route":"GET %s","startedAt":%s,"endedAt":%s}\n' "$1" "$started" "$(date +%s%3N)" >> "$SMOKE/failures.jsonl"
            elif [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              failed=1; printf '{"route":"GET %s","startedAt":%s,"endedAt":%s,"status":%s}\n' "$1" "$started" "$(date +%s%3N)" "$status" >> "$SMOKE/failures.jsonl"
            fi
          }
          check /
          grep -qi '^x-robots-tag: noindex, nofollow' "$SMOKE/headers" || { echo "::error::/ lacks X-Robots-Tag: noindex, nofollow"; failed=1; }
          check /healthz
          check /menu/chocolate-cake
          if [ "$failed" -ne 0 ]; then sleep 10; fi # let the failed requests' events reach the tail
          kill "$tail_pid" 2>/dev/null || :
          for _ in $(seq 1 10); do kill -0 "$tail_pid" 2>/dev/null || break; sleep 1; done
          kill -9 "$tail_pid" 2>/dev/null || :
          if [ "$failed" -ne 0 ]; then
            node scripts/cpu-measure.ts --failures-only --tail "$SMOKE/tail.json" --timeouts "$SMOKE/failures.jsonl"
            echo "::error::Staging smoke check failed (diagnostics above)."
            exit 1
          fi

  production-preflight:
    if: github.ref == 'refs/heads/production' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.keys.outputs.configured }}
    steps:
      - uses: actions/checkout@v5
      - name: Check deploy keys
        id: keys
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: src/scripts/check-keys.sh CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PRODUCTION_DATABASE_URL
      - name: Check staging already runs this commit
        if: steps.keys.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/deployments?environment=staging&sha=$SHA" --jq '.[].id')
          for id in $ids; do
            ok=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '[.[] | select(.state == "success")] | length')
            if [ "$ok" -gt 0 ]; then echo "Staging runs $SHA"; exit 0; fi
          done
          echo "::error::Commit $SHA has no successful staging deploy. Merge it to main, let staging deploy, then fast-forward production."
          exit 1

  production:
    needs: production-preflight
    if: needs.production-preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - name: Apply pending migrations (production)
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run db:migrate
      - name: Build, check and deploy (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Optional plain repository variable (not a secret); empty = deploy without Hyperdrive.
          HYPERDRIVE_ID: ${{ vars.PRODUCTION_HYPERDRIVE_ID }}
        run: npm run deploy:production
      - name: Launch readiness (production, secret names only)
        # Lists which core secrets and optional integrations the Worker still lacks
        # (scripts/launch-readiness.ts). Warns in the run summary; never fails the deploy.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run check:launch -- production
      - name: Smoke check (production database and Auth answer)
        if: vars.PRODUCTION_URL != ''
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: curl -fsS "$PRODUCTION_URL/healthz"
