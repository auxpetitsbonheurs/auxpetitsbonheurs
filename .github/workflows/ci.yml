name: ci

# Lint, typecheck, unit tests, build and the JS budget (NFR-001, NFR-012).
# Needs no secrets: deploys run in Workers Builds (S-002). The e2e job (S-005) runs
# Playwright against a local build and a throwaway Postgres service (test-only password).
#
# Runner minutes matter (private repo, free plan): a commit that changes only docs/**,
# production/**, prototypes/** or *.md outside src/ (minus the docs unit tests read) skips
# app and e2e (the `changes` job decides), yet the run still ends green, so deploy.yml
# (which waits for a green ci on the commit) is never blocked. secret-scan always runs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Compares against the last commit whose ci passed on this branch (not just the pushed
    # range): a docs-only push that cancels a code push's run must still test that code.
    # A pull request compares against its base. When in doubt it says "code".
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "$PR_BASE" HEAD) || base=""
          else
            base=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$BRANCH&event=push&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty') || base=""
          fi
          if [ -z "$base" ] || ! git merge-base --is-ancestor "$base" HEAD 2>/dev/null; then
            echo "No tested base found: running everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Docs that unit tests read (tokens, runbooks, CPU evidence, src/README.md) count as code.
          code=$(git diff --name-only "$base" HEAD | awk '
            /^docs\/(design|runbooks)\// || /^docs\/architecture\/cpu-measurements\.md$/ { print; next }
            /^(docs|production|prototypes)\// { next }
            /\.md$/ && !/^src\// { next }
            { print }')
          if [ -n "$code" ]; then
            echo "Code changed since $base:"; echo "$code" | head -20
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs changed since $base: app and e2e are skipped."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  app:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # `npm test` took 31 min while every test migrated its own PGlite (run 43239965095); the
    # suite now migrates once per run and resets between tests (app/db/testing/pglite.ts).
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:js-budget
      # Threat model G-19: the browser bundle names no server secret and holds no secret value.
      - run: npm run check:client-secrets

  secret-scan:
    # Threat model G-19: gitleaks over the whole git history. The binary is a pinned release,
    # verified against its published SHA-256 before it runs (no third-party action, no token).
    # Known false positives (test fixtures, e2e placeholders) are listed by fingerprint in
    # .gitleaksignore; findings are printed redacted.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  e2e:
    # Runs beside `app`, not after it: it builds the app itself. Two shards, each with its own
    # Postgres and one worker (a 2-core runner gains nothing from a second worker). 817 tests on
    # one runner took 24 min (run 43239965095); each shard runs the skeleton project first.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI database; must match DATABASE_URL in wrangler.jsonc env "e2e".
          # The e2e global setup creates (drops and recreates) the database apb_e2e itself;
          # Playwright starts the web server first, so its readiness probe must not need it.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      # Not the "with deps" install flavour: it always runs `apt-get update`, and Ubuntu mirror DNS outages failed
      # runs 43031233818 and 43039279359 before any test ran. The script touches apt (with
      # retries) only if the runner image lacks a library Chromium needs.
      - run: npx playwright install chromium
      - run: scripts/ensure-browser-deps.sh
        timeout-minutes: 8
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: |
            src/test-results
            src/playwright-report
          retention-days: 7
