name: ci

# Lint, typecheck, unit tests, build and the JS budget (NFR-001, NFR-012).
# Needs no secrets: deploys run in Workers Builds (S-002). The e2e job (S-005) runs
# Playwright against a local build and a throwaway Postgres service (test-only password).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    # The unit suite (one PGlite database per test) passed 15 minutes on 2026-11-12 (run
    # 43144000030 timed out in `npm test`); tech-debt.md tracks making it faster.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:js-budget
      # Threat model G-19: the browser bundle names no server secret and holds no secret value.
      - run: npm run check:client-secrets

  secret-scan:
    # Threat model G-19: gitleaks over the whole git history. The binary is a pinned release,
    # verified against its published SHA-256 before it runs (no third-party action, no token).
    # Known false positives (test fixtures, e2e placeholders) are listed by fingerprint in
    # .gitleaksignore; findings are printed redacted.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the git history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .'

  e2e:
    needs: app
    runs-on: ubuntu-latest
    # 703 specs on one worker reached ~19 min in batch 5 (run 43167358551, cut off at 20).
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway CI database; must match DATABASE_URL in wrangler.jsonc env "e2e".
          # The e2e global setup creates (drops and recreates) the database apb_e2e itself;
          # Playwright starts the web server first, so its readiness probe must not need it.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/package-lock.json
      - run: npm ci
      # Not the "with deps" install flavour: it always runs `apt-get update`, and Ubuntu mirror DNS outages failed
      # runs 43031233818 and 43039279359 before any test ran. The script touches apt (with
      # retries) only if the runner image lacks a library Chromium needs.
      - run: npx playwright install chromium
      - run: scripts/ensure-browser-deps.sh
        timeout-minutes: 8
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: |
            src/test-results
            src/playwright-report
          retention-days: 7
