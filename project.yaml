# Claude Code Web Studios — project configuration (single source of truth).
# Skills read this file; /setup-stack, /start and /settings write it.
# Per-developer overrides go in project.local.yaml (gitignored).
#
# `/start` adds `modes.rigor` and `modes.automation`. Do not hand-seed the
# knobs rigor expands to (review_mode, tdd, docs_density, hook_strictness):
# a written value pins that knob and the rigor setting stops changing it.

schema_version: 1

framework:
  name: claude-code-web-studios
  version: 0.1.0

project:
  name: Aux petits bonheurs            # set by /start or /setup-stack
  type: ecommerce            # saas | marketing | ecommerce | api | mixed
  stage: build           # discovery | design | build | launch | grow

stack:
  language: typescript        # typescript | javascript | python | go | php | ruby
  package_manager: npm # pnpm | npm | yarn | bun | uv | poetry | go | composer | bundler
  frontend: remix        # nextjs | remix | nuxt | sveltekit | astro | angular | solidstart | qwik | none
  backend: native         # native | express | fastify | nestjs | hono | fastapi | django | go | laravel | rails | supabase | firebase
  database: postgres        # postgres | mysql | sqlite | mongodb | supabase | firebase | none
  orm: drizzle             # prisma | drizzle | sqlalchemy | django-orm | gorm | eloquent | activerecord | mongoose | none
  styling: tailwind-shadcn
  cache_queue: none     # redis | bullmq | celery | sidekiq | none
  search: none          # meilisearch | algolia | typesense | pgvector | elasticsearch | none
  auth: supabase-auth            # clerk | authjs | lucia | better-auth | supabase-auth | firebase-auth | custom | none
  payments: none        # stripe | paddle | lemonsqueezy | none
  cms: none             # sanity | payload | strapi | contentful | none
  ai: none              # anthropic | openai | multi | none
  realtime: none        # websockets | sse | supabase-realtime | pusher | liveblocks | none
  email: resend           # resend | postmark | sendgrid | ses | none
  analytics: none       # posthog | plausible | ga4 | none
  observability: sentry   # sentry | otel | datadog | none
  hosting: cloudflare         # vercel | netlify | cloudflare | fly | railway | render | aws | gcp | azure
  test_unit: vitest       # vitest | jest | pytest | go-test | phpunit | rspec
  test_e2e: playwright

# Stack specialist agents in use (filled by /setup-stack from `stack`).
specialists: [remix-specialist, tailwind-shadcn-specialist, postgres-specialist, baas-specialist, auth-specialist, email-specialist, hosting-platform-specialist, observability-engineer, test-engineer]

budgets:
  lighthouse:
    performance: 90
    accessibility: 95
    best_practices: 95
    seo: 95
  web_vitals:
    lcp_ms: 2500
    inp_ms: 200
    cls: 0.1
  js_initial_kb: 170      # gzipped JS on first load per route
  image_max_kb: 300       # brief: photos about 300 kB or less (aligned 2026-11-10)

a11y:
  standard: WCAG 2.2 AA

i18n:
  default_locale: en
  locales: [en, fr]

privacy:
  regions: [mu]            # Mauritius Data Protection Act 2017 (ADR-0001; regime to confirm, PRD Q12)

modes:
  rigor: standard
  automation: auto
  push_tests: off        # Owner 2026-11-10: skip local unit tests before git push; CI runs them

paths:
  code_root: src
